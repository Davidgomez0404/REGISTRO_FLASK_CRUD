{% extends 'base.html' %}

{% block body %}

<h1>Mis favoritos</h1>

<a href="{{ url_for('dashboard') }}">Volver al dashboard</a>

<a href="{{ url_for('cerrarsesion') }}">Cerrar sesion</a>


{% if not favoritos %}
    <p>No hay favoritos</p>
{% else %}
    {% for f in favoritos %}
        <div>
            <p>{{ f[1] }}</p>
            <img src="{{ f[2] }}" alt="" width="100">
            <form action="{{ url_for('actualizar') }}" method="post">
                <input type="hidden" name="p_id" value="{{ f[0] }}">
                <input type="text" name="name" placeholder="Nuevo nombre">
                <button>Actualizar</button>
            </form>
            <form action="{{ url_for('borrar') }}" method="post">
                <input type="hidden" name="p_id" value="{{ f[0] }}">
                <button>Borrar</button>
            </form>
        </div>
    {% endfor %}
{% endif %}

{% endblock %}
